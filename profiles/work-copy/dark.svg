
<svg width="800" height="116" viewBox="0 0 800 116" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Fira+Code:wght@300..700&amp;family=Inter+Tight:ital,wght@0,100..900;1,100..900&amp;family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;family=Outfit:wght@100..900&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&amp;family=Roboto:ital,wght@0,100..900;1,100..900&amp;family=Space+Grotesk:wght@300..700&amp;display=swap');

    * {
      box-sizing: border-box;
    }

    text {
      user-select: none;
    }

    .gitascii-canvas-bg {
      fill: #0d1117;
      transition: fill 0.3s ease;
    }

    @media (prefers-color-scheme: light) {
      .gitascii-canvas-bg {
        fill: #ffffff !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      .gitascii-canvas-bg {
        fill: #0d1117 !important;
      }
    }
  </style>

  <rect class="" width="800" height="116" fill="#0a0a0a" rx="8" />

  
</svg>