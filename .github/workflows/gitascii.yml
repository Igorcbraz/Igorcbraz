name: Update GitAscii

on:
  workflow_dispatch:
  schedule:
    - cron: '14 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: gitascii-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate and Publish GitAscii SVGs
        uses: Igorcbraz/GitAscii/action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pro_telemetry: true
          refresh_minutes: 60
